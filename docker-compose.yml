version: '3.8'
services:
  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  tomcat_app:
    image: tomcat:9.0-jdk11
    depends_on:
      - postgres_db
    ports:
      - "8080:8080"
    volumes:
      - ./target/StudentManagementApp.war:/usr/local/tomcat/webapps/ROOT.war
